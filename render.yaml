# One-click deploy on Render's free plan: New > Blueprint > pick this repo.
services:
  - type: web
    name: promptedit-studio
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: PromptEdit Studio
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: promptedit-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      # Secrets: filled in on the Render dashboard, never committed.
      - key: PIXELFORGE_API_KEY
        sync: false
      - key: PIXELFORGE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false

databases:
  - name: promptedit-db
    plan: free
    region: singapore
    databaseName: promptedit
    user: promptedit
